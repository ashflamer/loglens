line-length = 110
# Matches the CI matrix (3.10-3.13), not the old py39 value.
target-version = "py310"

[lint]
# Pinned explicitly so a new ruff release can't turn CI red on its own.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length is enforced by line-length above
    "UP045",  # Optional[X] is deliberate: these are Pydantic models and the
              # explicit form reads better in generated OpenAPI docs
    "UP007",  # same reasoning for Union[]
]

[lint.per-file-ignores]
# FastAPI *requires* callables in argument defaults - File(), Depends(),
# Query() - so B008 is a false positive for the whole router module.
"app/api.py" = ["B008"]
